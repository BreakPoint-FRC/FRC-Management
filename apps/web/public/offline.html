<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · BreakPoint</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #ef4444;
        margin: 0 auto 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.5;
        max-width: 28rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been opened before, so there's no cached copy. Pages you
        have already visited stay available without a connection.
      </p>
    </main>
  </body>
</html>
