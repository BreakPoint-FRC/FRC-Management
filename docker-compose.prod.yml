# Production stack: Postgres + a one-shot migration step + the API + the web
# app. docker-compose.yml (no suffix) is dev-only -- it starts Postgres alone,
# because `pnpm dev` runs the apps directly on the host. This file is the
# opposite: it builds and runs everything in containers.
#
#   cp .env.example .env                     # then edit it -- see below
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Read docs/deployment.md before the first real deploy. Three things below are
# easy to get wrong silently:
#
# 1. POSTGRES_PASSWORD, in .env, has no default here on purpose -- Compose
#    refuses to start rather than run production on the same password every
#    clone of this repository would otherwise share.
# 2. NEXT_PUBLIC_API_URL must be the address a BROWSER can reach the API at
#    (the public one behind your reverse proxy/TLS), never the Docker-internal
#    "api" hostname -- and it is baked into the web image at build time, so
#    changing it later means rebuilding `web`, not just restarting it.
# 3. `db:bootstrap` is NOT wired in here as a service that runs automatically.
#    It resets the platform admin's password and revokes its live sessions --
#    see docs/deployment.md for the one-time command and exactly what it does
#    and does not revoke.
# 4. `api`/`web` publish their ports on 127.0.0.1 only, not every interface.
#    Reaching them from anywhere else has to go through the reverse proxy
#    below -- that's also why `api` trusts one hop of X-Forwarded-For
#    (TRUST_PROXY_HOPS): the only caller that can reach it at all is that
#    proxy. Publishing these ports more broadly while leaving that trust in
#    place would let any caller spoof its own rate-limit identity.
#
# Nothing here terminates TLS. Put a reverse proxy (Caddy, nginx, Traefik --
# docs/deployment.md sketches a minimal Caddy config) in front of `api` and
# `web`; both listen on plain HTTP.

services:
  # Rejects known-placeholder or structurally broken values (still the
  # .env.example password, a POSTGRES_PASSWORD with characters that corrupt
  # the connection string it gets built into, ...) before anything that could
  # act on them runs. See scripts/check-deploy-env.mjs -- Compose's own
  # `${VAR:?message}` guards below only catch a variable being unset, not one
  # that is set to something that will quietly misbehave.
  preflight:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-preflight
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying -- see docs/deployment.md}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env before deploying -- generate one with `openssl rand -hex 32`}"
      WEB_ORIGIN: "${WEB_ORIGIN:?Set WEB_ORIGIN in .env before deploying -- the public origin the web app is served from}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env before deploying -- the browser-reachable API origin}"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-breakpoint}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying -- see docs/deployment.md}"
      POSTGRES_DB: ${POSTGRES_DB:-breakpoint}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # Not exposed to the host on purpose: api/migrate reach it over the
    # compose network by service name. Run `docker compose -f
    # docker-compose.prod.yml exec postgres pg_dump ...` for a backup rather
    # than opening the port -- see docs/deployment.md.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breakpoint} -d ${POSTGRES_DB:-breakpoint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies pending migrations and exits. Runs on every `up`, but
  # `prisma migrate deploy` only ever applies what is not already applied --
  # an already-current database is a fast no-op, not a re-run. `api` will not
  # start until this exits 0. This is also the image to use for the one-off
  # admin commands (`db:bootstrap`, `db:seed`) -- see docs/deployment.md.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-migrator
    command: ["pnpm", "--filter", "@breakpoint/db", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-breakpoint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-breakpoint}
    depends_on:
      postgres:
        condition: service_healthy
      preflight:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Named one by one rather than `env_file: .env`: that file also holds
    # SYSTEM_ADMIN_EMAIL/PASSWORD (only db:bootstrap reads those -- see
    # `migrate` above) and NEXT_PUBLIC_API_URL (web's build-time value). This
    # process has no legitimate use for either, and hands a compromised
    # container one less credential to find.
    environment:
      # Overrides whatever DATABASE_URL is in .env: that file's value points
      # at localhost for local dev, which inside this container is the api
      # container itself, not the postgres one. Built from the same
      # POSTGRES_* vars as the postgres service above so the two cannot
      # disagree with each other.
      DATABASE_URL: postgresql://${POSTGRES_USER:-breakpoint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-breakpoint}
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env before deploying -- generate one with `openssl rand -hex 32`}"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      # The origin CORS accepts requests from -- the public web origin, same
      # value as WEB_ORIGIN in .env.
      WEB_ORIGIN: "${WEB_ORIGIN:?Set WEB_ORIGIN in .env before deploying -- the public origin the web app is served from}"
      # Fastify trusts exactly this many hops of X-Forwarded-For before using
      # it as the real client IP (rate limiting, request.ip). 1 because the
      # only thing that can reach this container at all is the loopback-bound
      # port below -- see this file's header and docs/deployment.md. Do not
      # raise this, and do not set it while the port below is reachable from
      # anywhere but localhost: trusting XFF from an untrusted caller lets it
      # claim any IP it likes, which defeats /auth/login's rate limit outright.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      # Bound to loopback, not "all interfaces": Caddy (or whatever terminates
      # TLS, per docs/deployment.md) runs on this same host and reaches this
      # port over 127.0.0.1. Without this, :4000 is reachable directly from
      # the network on every interface, TLS and all -- HTTPS in front does not
      # stop someone from just using HTTP straight to the container port.
      - "127.0.0.1:${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl/wget dependency: Node 20 has global fetch. Reads API_PORT
      # from its own environment so a custom port never falls out of sync
      # with what the server actually bound.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+(process.env.API_PORT||4000)+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time only -- see this file's header. Required; the Dockerfile
        # refuses to build without it rather than silently baking in
        # localhost.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env before deploying -- the browser-reachable API origin, not the Docker service name}"
    restart: unless-stopped
    # No JWT_SECRET, no database credentials, nothing api-only here: this
    # process serves static assets and client JS, and NEXT_PUBLIC_API_URL is
    # already baked into that JS at build time (this file's header) -- there
    # is nothing left for it to read from the environment at runtime except
    # its own port.
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
    ports:
      # Loopback-only, same reasoning as api's port above.
      - "127.0.0.1:${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    depends_on:
      # Ordering only -- web never calls api from the server side (no route
      # handlers, no server actions; every fetch is client-side, straight
      # from the browser to NEXT_PUBLIC_API_URL). api being down does not
      # stop this container from starting, it just means every page a
      # visitor opens shows a fetch error until api is healthy again.
      api:
        condition: service_healthy

volumes:
  # Named differently from docker-compose.yml's postgres_data on purpose.
  # Both files otherwise use the same top-level key, and Compose names a
  # volume "<project>_<key>" where <project> defaults to the directory
  # name -- run dev compose and this file from the same clone (a normal
  # thing to do while testing) and an unqualified "postgres_data" resolves
  # to the SAME volume in both. Postgres only applies POSTGRES_PASSWORD
  # while initializing a brand-new data directory, so the second compose
  # file to start silently inherits the first one's credentials instead of
  # the ones in .env -- migrate then fails with P1000: Authentication
  # failed, not an obviously-volume-related error. See docs/deployment.md.
  postgres_data_prod:
